name: Release

on:
  push:
    branches: [master]
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: meetrec-darwin-arm64
          - runner: macos-15-intel
            arch: x86_64
            asset: meetrec-darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          uname -m
          swift --version

      - name: Build
        run: swift build -c release

      - name: Package
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          bin_path="$(swift build -c release --show-bin-path)"
          mkdir -p dist
          install -m 755 "$bin_path/meetrec" "dist/$ASSET_NAME"

      - name: Verify architecture
        run: file "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: meetrec-darwin-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/meetrec-darwin-arm64 \
            dist/meetrec-darwin-amd64 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
